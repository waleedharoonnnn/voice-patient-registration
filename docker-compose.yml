services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: voiceai
      POSTGRES_PASSWORD: voiceai
      POSTGRES_DB: voiceai_test
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceai -d voiceai_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
