services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: voiceai
      POSTGRES_PASSWORD: voiceai
      POSTGRES_DB: voiceai_test
    ports:
      # Host port 5544, not 5432: this machine has multiple local Postgres installs
      # already bound to 5432/5433/5434, which silently win connections meant for
      # this container.
      - "5544:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceai -d voiceai_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
